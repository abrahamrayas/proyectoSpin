# External provider
spin.provider.base-url=http://localhost:8084
spin.provider.connect-timeout-ms=3000
spin.provider.read-timeout-ms=10000

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true
info.app.name=${spring.application.name}
info.app.description=Spin transaction execution API

# Tracing (OTLP export with profile observability)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false

logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

